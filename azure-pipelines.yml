trigger:
  branches:
    include:
      - main  # Trigger on changes to the 'main' branch (adjust as necessary)

pool:
  name: Default  # Use the 'Default' agent pool
  demands:
    - agent.name -equals test  # Use the self-hosted agent named 'test'

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'
